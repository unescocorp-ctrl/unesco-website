name: website-ci
on:
  pull_request:
    paths: ['apps/web/**', '.github/workflows/website-ci.yml']
  push:
    branches: [main, develop]
    paths: ['apps/web/**', '.github/workflows/website-ci.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
